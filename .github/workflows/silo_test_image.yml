# Fork-only: builds a test image of the Silo branch for a home server.
# Not part of the upstream contribution.
name: "Silo Test Image"

on:
  push:
    branches: [silo-test-image]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/maintainerr:silo-test
          build-args: |
            GIT_SHA=${{ github.sha }}
            VERSION_TAG=silo-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
